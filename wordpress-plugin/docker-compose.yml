# Bema Learn assessment environment.
#
#   docker compose up -d
#
# Brings up MySQL 8 and WordPress with the Bema Learn plugin mounted, activated
# and seeded. No manual WordPress install steps.
#
#   WordPress : http://localhost:8080
#   API       : http://localhost:8080/wp-json/bemalearn/v1/courses
#   Admin     : http://localhost:8080/wp-admin  (admin / assessment123)

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: assessment
      MYSQL_DATABASE: bemalearn
      MYSQL_USER: bemalearn
      MYSQL_PASSWORD: assessment
    ports:
      - "3307:3306"          # exposed so you can query it directly (Task 5)
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-passessment"]
      interval: 5s
      retries: 20

  wordpress:
    image: wordpress:6-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: bemalearn
      WORDPRESS_DB_USER: bemalearn
      WORDPRESS_DB_PASSWORD: assessment
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
    volumes:
      - ./:/var/www/html/wp-content/plugins/bemalearn
      - ./setup.sh:/usr/local/bin/bl-setup.sh:ro
    command: >
      bash -c "docker-entrypoint.sh apache2-foreground & 
               sleep 12 && bash /usr/local/bin/bl-setup.sh;
               wait"
